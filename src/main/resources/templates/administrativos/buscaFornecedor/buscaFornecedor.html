<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{header :: header-links}"></div>
    <style>
        .alert-success {
            background-color: #4caf50;
            color: #fff;
            border: none;
            border-radius: 8px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            position: relative;
            padding-right: 2.5rem;
        }
        .alert-danger {
            background-color: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 8px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            position: relative;
            padding-right: 2.5rem;
        }
        .btn-close {
            position: absolute;
            top: 50%;
            right: 0.8rem;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #fff;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }
        .btn-close::after { content: "X"; }
        .btn-close:focus { outline: none; box-shadow: none; }
    </style>
</head>
<body id="page-top" class="d-flex flex-column min-vh-100">
<div th:replace="~{menu :: menu-bar}"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="page-title-box">
                <h2 class="page-title float-left">Buscar Fornecedores</h2>
                <ol class="breadcrumb float-right" style="background-color: #e6d9fc;">
                    <li class="breadcrumb-item"><a th:href="@{/home}" style="color: #6610f2;">Home</a></li>
                    <li class="breadcrumb-item active"><a th:href="@{/BuscarFornecedores}" style="color: #6610f2;">Buscar Fornecedores</a></li>
                </ol>
            </div>
        </div>
    </div>

    <!-- Alerts -->
    <div class="row">
        <div class="col-12">
            <div id="alertContainer"></div>
        </div>
    </div>

    <!-- Campo de busca -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h4 class="m-t-0 font-weight-bold float-left" style="color: #6610f2;">
                <b>Pesquisar por CNPJ</b>
            </h4>
            <div class="row float-right" style="padding: 0 15px;">
                <div class="col-md-12">
                    <div class="input-group">
                        <input type="text" id="cnpj" class="form-control" placeholder="Digite o CNPJ">
                        <button class="btn text-white" style="background-color: #6610f2;" onclick="buscarFornecedor()">
                            <i class="fa fa-search"></i> Buscar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabela -->
        <div class="card-body">
            <table id="datatable" class="table table-striped table-bordered basic-datatable">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>CNPJ</th>
                    <th>Email</th>
                    <th>DDD/Telefone</th>
                    <th>CEP</th>
                    <th>Cidade/UF</th>
                    <th>Endereço</th>
                    <th></th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{footer :: footer-content}" class="mt-auto"></footer>

<script src="/js/buscar-fornecedores.js" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
