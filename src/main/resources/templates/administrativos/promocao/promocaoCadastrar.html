<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <div th:replace="~{header :: header-links}"></div>
  <style>
    .text-danger {
        color: #ff0000 !important; /* vermelho forte */
        font-weight: bold;
        font-size: 1rem;
        display: block;
        margin-top: 5px;
        text-shadow: 0 0 2px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
<div th:replace="~{menu :: menu-bar}"></div>

<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="page-title-box">
        <h2 class="page-title float-left" th:text="${modoEdicao} ? 'Edição de Promoção' : 'Cadastro de Promoção'"></h2>
        <ol class="breadcrumb float-right" style="background-color: #e6d9fc;">
          <li class="breadcrumb-item"><a th:href="@{/home}" style="color: #6610f2;">Home</a></li>
          <li class="breadcrumb-item active"><a th:href="@{/PromocaoListar}" style="color: #6610f2;">Promoções</a></li>
        </ol>
      </div>
    </div>
  </div>
  <!-- Basic Card Example -->
  <div class="card shadow mb-4">
    <div class="card-header py-3">
      <h4 class="m-0 font-weight-bold" style="color: #6610f2;" th:text="${modoEdicao} ? 'Editar Promoção' : 'Nova Promoção'"></h4>
    </div>
    <div class="card-body">
      <form name="cadastrarpromocao" th:action="@{/PromocaoSalvar}" th:object="${promocao}" method="POST">
        <div class="form-row">
          <input type="hidden" class="form-control form-control-user"
                 id="idpromocao" name="idpromocao" aria-describedby="ID da promoção"
                 th:field="*{idPromocao}" readonly="readonly" placeholder="">
          <div class="form-group col-md-4">
            <label for="idproduto" class="col-form-label">Produto</label>
            <select th:field="*{produto}" name="idproduto" id="idproduto" class="form-control form-control-user">
              <option value="">Selecione</option>
              <option th:each="p : ${produtos}"
                      th:value="${p.idProduto}"
                      th:text="${p.nomeProduto}"
                      th:selected="${promocao.produto != null and promocao.produto.idProduto == p.idProduto}">
              </option>
            </select>
            <span th:if="${#fields.hasErrors('produto')}" th:errors="*{produto}" class="text-danger"></span>
          </div>
          <div class="form-group col-md-2">
            <label for="precopromocao" class="col-form-label">Preço da Promoção</label>
            <input type="number" step="any" class="form-control form-control-user"
                   id="precopromocao" name="precopromocao" aria-describedby="Nome da categoria"
                   th:field="*{precoPromocao}" placeholder="Informe o preço da promoção">
            <span th:if="${#fields.hasErrors('precoPromocao')}" th:errors="*{precoPromocao}" class="text-danger"></span>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <input class="btn btn-facebook btn-user btn-block" style="background-color: #6610f2;" type="submit" name="cadastrar" id="cadastrar" value="Cadastrar"/>
          </div>
          <div class="form-group col-md-6">
            <input class="btn btn-facebook btn-user btn-block" style="background-color: #6610f2;" type="reset" name="limpar" id="limpar" value="Limpar">
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
</div>

<footer th:replace="~{footer :: footer-content}" class="mt-auto"></footer>
</div>
</div>

</body>
</html>
