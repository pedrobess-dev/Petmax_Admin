<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{header :: header-links}"></div>
    <style>
        .text-danger {
        color: #ff0000 !important; /* vermelho forte */
        font-weight: bold;
        font-size: 1rem;
        display: block;
        margin-top: 5px;
        text-shadow: 0 0 2px rgba(0,0,0,0.2);
    }
    .alert-danger {
            background-color: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 8px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            position: relative;
            padding-right: 2.5rem;
    }
    .btn-close {
        position: absolute;
        top: 50%;
        right: 0.8rem;
        transform: translateY(-50%);
        background: none;
        border: none;
        font-size: 1.2rem;
        color: #fff;
        cursor: pointer;
        padding: 0;
        line-height: 1;
    }
    .btn-close::after {
        content: "X"; /* X clássico */
    }
    .btn-close:focus {
        outline: none;
        box-shadow: none;
    }
    </style>
</head>
<body>
<div th:replace="~{menu :: menu-bar}"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="page-title-box">
                <h2 class="page-title float-left" th:text="${modoEdicao} ? 'Edição de Usuário' : 'Cadastro de Usuário'"></h2>
                <ol class="breadcrumb float-right" style="background-color: #e6d9fc;">
                    <li class="breadcrumb-item"><a th:href="@{/home}" style="color: #6610f2;">Home</a></li>
                    <li class="breadcrumb-item active"><a th:href="@{/UsuarioListar}" style="color: #6610f2;">Usuários</a></li>
                </ol>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div th:if="${erroCpf}" class="alert alert-danger alert-dismissible fade show" role="alert" id="errorAlert">
                <span th:text="${erroCpf}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>
    </div>
    <!-- Basic Card Example -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h4 class="m-0 font-weight-bold" style="color: #6610f2;" th:text="${modoEdicao} ? 'Editar Usuário' : 'Novo Usuário'"></h4>
        </div>
        <div class="card-body">
            <form name="cadastrarusuario" th:action="@{/UsuarioSalvar}" th:object="${usuario}" method="POST">
                <div class="form-row">
                    <input type="hidden" class="form-control form-control-user"
                           id="idusuario" name="idusuario" aria-describedby="ID do usuario"
                           th:field="*{idUsuario}" readonly="readonly" placeholder="">
                    <div class="form-group col-md-4">
                        <label for="nomeprestador" class="col-form-label">Nome do Prestador</label>
                        <input type="text" class="form-control form-control-user"
                               id="nomeprestador" name="nomeprestador" aria-describedby="Nome do prestador"
                               th:field="*{nomePrestador}" placeholder="Informe o nome do prestador">
                        <span th:if="${#fields.hasErrors('nomePrestador')}" th:errors="*{nomePrestador}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="nomeusuario" class="col-form-label">Nome do Usuário</label>
                        <input type="text" class="form-control form-control-user"
                               id="nomeusuario" name="nomeusuario" aria-describedby="Nome do usuário"
                               th:field="*{nomeUsuario}" placeholder="Informe o nome do usuário">
                        <span th:if="${#fields.hasErrors('nomeUsuario')}" th:errors="*{nomeUsuario}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="senha" class="col-form-label">Senha</label>
                        <input type="password" class="form-control form-control-user"
                               id="senha" name="senha" aria-describedby="Senha"
                               th:field="*{senha}" placeholder="Informe a senha">
                        <span th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="papel" class="col-form-label">Papel</label>
                        <select th:field="*{papel}" name="papel" id="papel" class="form-control form-control-user">
                            <option value="">Selecione</option>
                            <option value="ADMINISTRADOR">ADMINISTRADOR</option>
                            <option value="VENDEDOR">VENDEDOR</option>
                            <option value="ESTOQUISTA">ESTOQUISTA</option>
                        </select>
                        <span th:if="${#fields.hasErrors('papel')}" th:errors="*{papel}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="email" class="col-form-label">Email</label>
                        <input type="text" class="form-control form-control-user"
                               id="email" name="email" aria-describedby="Email do usuário"
                               th:field="*{email}" placeholder="Informe o email do usuário">
                        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="cpf" class="col-form-label">CPF</label>
                        <input type="text" class="form-control form-control-user"
                               id="cpf" name="cpf" aria-describedby="CPF do usuário"
                               th:field="*{cpf}" placeholder="Informe o CPF do usuário">
                        <span th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}" class="text-danger"></span>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <input class="btn btn-facebook btn-user btn-block" style="background-color: #6610f2;" type="submit" name="cadastrar" id="cadastrar" value="Cadastrar"/>
                    </div>
                    <div class="form-group col-md-6">
                        <input class="btn btn-facebook btn-user btn-block" style="background-color: #6610f2;" type="reset" name="limpar" id="limpar" value="Limpar">
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</div>

<footer th:replace="~{footer :: footer-content}" class="mt-auto"></footer>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/inputmask@5.0.8/dist/inputmask.min.js"></script>
<script>
    window.addEventListener("DOMContentLoaded", function () {
        const cpf = document.getElementById("cpf");

        if (cpf) {
            Inputmask("999.999.999-99").mask(cpf);
        }
    });
</script>

</body>
</html>
