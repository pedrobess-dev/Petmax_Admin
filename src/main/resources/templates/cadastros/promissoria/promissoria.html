<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{header :: header-links}"></div>
    <style>
        .alert-success {
            background-color: #4caf50;
            color: #fff;
            border: none;
            border-radius: 8px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            position: relative;
            padding-right: 2.5rem;
        }
        .alert-danger {
            background-color: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 8px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            position: relative;
            padding-right: 2.5rem;
        }
        .btn-close {
        position: absolute;
        top: 50%;
        right: 0.8rem;
        transform: translateY(-50%);
        background: none;
        border: none;
        font-size: 1.2rem;
        color: #fff;
        cursor: pointer;
        padding: 0;
        line-height: 1;
    }
    .btn-close::after {
        content: "X"; /* X clássico */
    }
    .btn-close:focus {
        outline: none;
        box-shadow: none;
    }
    </style>
</head>
<body id="page-top" class="d-flex flex-column min-vh-100">
<div th:replace="~{menu :: menu-bar}"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="page-title-box">
                <h2 class="page-title float-left">Promissorias</h2>
                <ol class="breadcrumb float-right" style="background-color: #e6d9fc;">
                    <li class="breadcrumb-item"><a th:href="@{/home}" style="color: #6610f2;">Home</a></li>
                    <li class="breadcrumb-item active"><a th:href="@{/PromissoriaListar}" style="color: #6610f2;">Promissorias</a></li>
                </ol>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div th:if="${mensagemErro}"
                 class="alert alert-danger alert-dismissible fade show mt-3"
                 role="alert"
                 id="errorAlert">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span th:text="${mensagemErro}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${mensagemSucesso}"
                 class="alert alert-success alert-dismissible fade show mt-3"
                 role="alert"
                 id="successAlert">
                <i class="fas fa-check-circle me-2"></i>
                <span th:text="${mensagemSucesso}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>
    </div>
    <!-- Basic Card Example -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h4 class="m-t-0 font-weight-bold float-left" style="color: #6610f2;">
                <b>Listagem</b>
            </h4>
            <div class="row float-right" style="padding: 0 15px;">
                <div class="col-md-12">
                    <div class="form-group pull-right">
                        <a class="btn text-white" style="background-color: #6610f2;" th:href="@{/PromissoriaNovo}"><i class="fa fa-plus" aria-hidden="true"></i> Novo</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-body">
            <table id="datatable" class="table table-striped table-bordered basic-datatable">
                <thead>
                <tr>
                    <th align="left">ID</th>
                    <th align="left">Cliente</th>
                    <th align="left">Produto</th>
                    <th align="left">Qtd. Vendida</th>
                    <th align="left">Valor</th>
                    <th align="left">Data Emissão</th>
                    <th align="left">Data Validade</th>
                    <th align="left">Status</th>
                    <th align="right"></th>
                    <th align="right"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="pr : ${promissorias}">
                    <td align="left" th:text="${pr.idPromissoria}"></td>
                    <td align="left" th:text="${pr.cliente != null ? pr.cliente.nomeCliente : 'N/A'}"></td>
                    <td align="left" th:text="${pr.produto != null ? pr.produto.nomeProduto : 'N/A'}"></td>
                    <td align="left" th:text="${pr.qtdVendida}"></td>
                    <td align="left" th:text="${pr.valor}"></td>
                    <td align="left" th:text="${pr.dataEmiFormatada}"></td>
                    <td align="left" th:text="${pr.dataValiFormatada}"></td>
                    <td align="left" th:text="${pr.status}"></td>
                    <td align="center">
                        <a th:href="@{/PromissoriaExcluir/{id}(id=${pr.idPromissoria})}">
                            <button class="btn btn-group-lg btn-danger">Excluir</button>
                        </a>
                    </td>
                    <td align="center">
                        <a th:href="@{/PromissoriaEditar/{id}(id=${pr.idPromissoria})}">
                            <button class="btn btn-group-lg btn-warning">Editar</button>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</div>

<footer th:replace="~{footer :: footer-content}" class="mt-auto"></footer>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    $(document).ready(function() {
        console.log('entrei ready');
        $('#datatable').DataTable({
            "scrollY": "300px",
            "scrollCollapse": true,
            "autoWidth": false,
            "oLanguage": {
                "sProcessing": "Processando...",
                "sLengthMenu": "Mostar _MENU_ registros",
                "sZeroRecords": "Nenhum registro encontrado.",
                "sInfo": "Mostrando de _START_ até _END_ de _TOTAL_ registros",
                "sInfoEmpty": "Mostrando de 0 até 0 de 0 registros",
                "sInfoFiltered": "",
                "sInfoPostFix": "",
                "sSearch": "Buscar:",
                "sUrl": "",
                "oPaginate": {
                    "sFirst": "Primeiro",
                    "sPrevious": "Anterior",
                    "sNext": "Seguinte",
                    "sLast": "Último"
                }
            }
        });
    });
</script>

</body>
</html>
