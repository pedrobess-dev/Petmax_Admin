<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{header :: header-links}"></div>
    <style>
        .text-danger {
        color: #ff0000 !important; /* vermelho forte */
        font-weight: bold;
        font-size: 1rem;
        display: block;
        margin-top: 5px;
        text-shadow: 0 0 2px rgba(0,0,0,0.2);
    }
    </style>
</head>
<body>
<div th:replace="~{menu :: menu-bar}"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="page-title-box">
                <h2 class="page-title float-left" th:text="${modoEdicao} ? 'Edição de Cliente' : 'Cadastro de Cliente'"></h2>
                <ol class="breadcrumb float-right" style="background-color: #e6d9fc;">
                    <li class="breadcrumb-item"><a th:href="@{/home}" style="color: #6610f2;">Home</a></li>
                    <li class="breadcrumb-item active"><a th:href="@{/ClienteListar}" style="color: #6610f2;">Clientes</a></li>
                </ol>
            </div>
        </div>
    </div>
    <!-- Basic Card Example -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h4 class="m-0 font-weight-bold" style="color: #6610f2;" th:text="${modoEdicao} ? 'Editar Cliente' : 'Novo Cliente'"></h4>
        </div>
        <div class="card-body">
            <form name="cadastrarcliente" th:action="@{/ClienteSalvar}" th:object="${cliente}" method="POST">
                <div class="form-row">
                    <input type="hidden" class="form-control form-control-user"
                           id="idcliente" name="idcliente" aria-describedby="ID do cliente"
                           th:field="*{idCliente}" readonly="readonly" placeholder="">
                    <div class="form-group col-md-4">
                        <label for="nomecliente" class="col-form-label">Nome do cliente</label>
                        <input type="text" class="form-control form-control-user"
                               id="nomecliente" name="nomecliente" aria-describedby="Nome do cliente"
                               th:field="*{nomeCliente}" placeholder="Informe o nome do cliente">
                        <span th:if="${#fields.hasErrors('nomeCliente')}" th:errors="*{nomeCliente}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="telefone" class="col-form-label">Descrição</label>
                        <input type="text" class="form-control form-control-user"
                               id="telefone" name="telefone" aria-describedby="Telefone do cliente"
                               th:field="*{telefone}" placeholder="Informe o telefone do cliente">
                        <span th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}" class="text-danger"></span>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <input class="btn btn-facebook btn-user btn-block" style="background-color: #6610f2;" type="submit" name="cadastrar" id="cadastrar" value="Cadastrar"/>
                    </div>
                    <div class="form-group col-md-6">
                        <input class="btn btn-facebook btn-user btn-block" style="background-color: #6610f2;" type="reset" name="limpar" id="limpar" value="Limpar">
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</div>

<footer th:replace="~{footer :: footer-content}" class="mt-auto"></footer>
</div>
</div>

</body>
</html>
