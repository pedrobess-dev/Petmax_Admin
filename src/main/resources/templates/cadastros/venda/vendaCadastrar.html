<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{header :: header-links}"></div>
    <style>
        .text-danger {
        color: #ff0000 !important; /* vermelho forte */
        font-weight: bold;
        font-size: 1rem;
        display: block;
        margin-top: 5px;
        text-shadow: 0 0 2px rgba(0,0,0,0.2);
    }
    </style>
</head>
<body>
<div th:replace="~{menu :: menu-bar}"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="page-title-box">
                <h2 class="page-title float-left" th:text="${modoEdicao} ? 'Edição de Venda' : 'Cadastro de Venda'"></h2>
                <ol class="breadcrumb float-right" style="background-color: #e6d9fc;">
                    <li class="breadcrumb-item"><a th:href="@{/home}" style="color: #6610f2;">Home</a></li>
                    <li class="breadcrumb-item active"><a th:href="@{/VendaListar}" style="color: #6610f2;">Vendas</a></li>
                </ol>
            </div>
        </div>
    </div>
    <!-- Basic Card Example -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h4 class="m-0 font-weight-bold" style="color: #6610f2;" th:text="${modoEdicao} ? 'Editar Venda' : 'Nova Venda'"></h4>
        </div>
        <div class="card-body">
            <form name="cadastrarvenda" th:action="@{/VendaSalvar}" th:object="${venda}" method="POST">
                <div class="form-row">
                    <input type="hidden" class="form-control form-control-user"
                           id="idvenda" name="idvenda" aria-describedby="ID da venda"
                           th:field="*{idVenda}" readonly="readonly" placeholder="">
                    <div class="form-group col-md-4">
                        <label for="idcliente" class="col-form-label">Cliente</label>
                        <select th:field="*{cliente}" name="idcliente" id="idcliente" class="form-control form-control-user">
                            <option value="">Selecione</option>
                            <option th:each="cli : ${clientes}"
                                    th:value="${cli.idCliente}"
                                    th:text="${cli.nomeCliente}"
                                    th:selected="${venda.cliente != null and venda.cliente.idCliente == cli.idCliente}">
                            </option>
                        </select>
                        <span th:if="${#fields.hasErrors('cliente')}" th:errors="*{cliente}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="idproduto" class="col-form-label">Produto</label>
                        <select th:field="*{produto}" name="idproduto" id="idproduto" class="form-control form-control-user">
                            <option value="">Selecione</option>
                            <option th:each="prod : ${produtos}"
                                    th:value="${prod.idProduto}"
                                    th:text="${prod.nomeProduto}"
                                    th:selected="${venda.produto != null and venda.produto.idProduto == prod.idProduto}">
                            </option>
                        </select>
                        <span th:if="${#fields.hasErrors('produto')}" th:errors="*{produto}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="qtdVendida" class="col-form-label">Valor</label>
                        <input type="number" step="1" class="form-control form-control-user"
                               id="qtdVendida" name="qtdVendida" aria-describedby="Quantidade vendida"
                               th:field="*{qtdVendida}" placeholder="Informe a quantidade vendida">
                        <span th:if="${#fields.hasErrors('qtdVendida')}" th:errors="*{qtdVendida}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="valorVenda" class="col-form-label">Valor</label>
                        <input type="number" step="any" class="form-control form-control-user"
                               id="valorVenda" name="valorVenda" aria-describedby="Valor da venda"
                               th:field="*{valorVenda}" placeholder="Informe o valor da venda">
                        <span th:if="${#fields.hasErrors('valorVenda')}" th:errors="*{valorVenda}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="dataVenda" class="col-form-label">Data da Venda</label>
                        <input type="date" class="form-control form-control-user"
                               id="dataVenda" name="dataVenda" aria-describedby="Data da venda"
                               th:field="*{dataVenda}" placeholder="Informe a data da venda">
                        <span th:if="${#fields.hasErrors('dataVenda')}" th:errors="*{dataVenda}" class="text-danger"></span>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <input class="btn btn-facebook btn-user btn-block" style="background-color: #6610f2;" type="submit" name="cadastrar" id="cadastrar" value="Cadastrar"/>
                    </div>
                    <div class="form-group col-md-6">
                        <input class="btn btn-facebook btn-user btn-block" style="background-color: #6610f2;" type="reset" name="limpar" id="limpar" value="Limpar">
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</div>

<footer th:replace="~{footer :: footer-content}" class="mt-auto"></footer>
</div>
</div>

<script src="https://unpkg.com/inputmask@5.0.8/dist/inputmask.min.js"></script>
<script>
    window.addEventListener("DOMContentLoaded", function () {
        const valorVenda = document.getElementById("valorVenda");

        if (valorVenda) {
            Inputmask({
                alias: "currency",
                prefix: "R$ ",
                groupSeparator: ".",
                radixPoint: ",",
                digits: 2,
                digitsOptional: false,
                rightAlign: false,
                autoUnmask: true
            }).mask(valorVenda);
        }
    });
</script>

</body>
</html>
