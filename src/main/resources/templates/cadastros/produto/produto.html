<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{header :: header-links}"></div>
    <style>
        .alert-success {
            background-color: #4caf50;
            color: #fff;
            border: none;
            border-radius: 8px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            position: relative;
            padding-right: 2.5rem;
        }
        .alert-danger {
            background-color: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 8px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            position: relative;
            padding-right: 2.5rem;
        }
        .btn-close {
        position: absolute;
        top: 50%;
        right: 0.8rem;
        transform: translateY(-50%);
        background: none;
        border: none;
        font-size: 1.2rem;
        color: #fff;
        cursor: pointer;
        padding: 0;
        line-height: 1;
    }
    .btn-close::after {
        content: "X"; /* X clássico */
    }
    .btn-close:focus {
        outline: none;
        box-shadow: none;
    }
    </style>
</head>
<body id="page-top" class="d-flex flex-column min-vh-100">
<div th:replace="~{menu :: menu-bar}"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="page-title-box">
                <h2 class="page-title float-left">Produtos</h2>
                <ol class="breadcrumb float-right" style="background-color: #e6d9fc;">
                    <li class="breadcrumb-item"><a th:href="@{/home}" style="color: #6610f2;">Home</a></li>
                    <li class="breadcrumb-item active"><a th:href="@{/ProdutoListar}" style="color: #6610f2;">Produtos</a></li>
                </ol>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div th:if="${mensagemErro}"
                 class="alert alert-danger alert-dismissible fade show mt-3"
                 role="alert"
                 id="errorAlert">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span th:text="${mensagemErro}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${mensagemSucesso}"
                 class="alert alert-success alert-dismissible fade show mt-3"
                 role="alert"
                 id="successAlert">
                <i class="fas fa-check-circle me-2"></i>
                <span th:text="${mensagemSucesso}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>
    </div>
    <!-- Basic Card Example -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h4 class="m-t-0 font-weight-bold float-left" style="color: #6610f2;">
                <b>Listagem</b>
            </h4>
            <div class="row float-right" style="padding: 0 15px;">
                <div class="col-md-12">
                    <div class="form-group pull-right">
                        <a class="btn text-white" style="background-color: #6610f2;" th:href="@{/ProdutoNovo}"><i class="fa fa-plus" aria-hidden="true"></i> Novo</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-body">
            <table id="datatable" class="table table-striped table-bordered basic-datatable">
                <thead>
                <tr>
                    <th align="left">ID</th>
                    <th align="left">Nome</th>
                    <th align="left">Preço</th>
                    <th align="left">Categoria</th>
                    <th align="left">Fornecedor</th>
                    <th align="left">Quantidade</th>
                    <th align="left">Em Promoção?</th>
                    <th align="right"></th>
                    <th align="right"></th>
                    <th align="right"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${produtos}">
                    <td align="left" th:text="${p.idProduto}"></td>
                    <td align="left" th:text="${p.nomeProduto}"></td>
                    <td align="left" th:text="${'R$' + p.preco}"></td>
                    <td align="left" th:text="${p.categoria != null ? p.categoria.nomeCategoria : 'N/A'}"></td>
                    <td align="left" th:text="${p.fornecedor != null ? p.fornecedor.nomeFornecedor : 'N/A'}"></td>
                    <td align="left" th:text="${p.qtdEstoque}"></td>
                    <td th:text="${p != null ? (p.temPromocao ? 'SIM' : 'NÃO') : '-'}"></td>
                    <td align="center">
                        <button class="btn btn-info"
                                data-bs-toggle="modal"
                                th:data-bs-target="'#modalDetalhes' + ${p.idProduto}">
                            Detalhes
                        </button>
                    </td>
                    <td align="center">
                        <a th:href="@{/ProdutoExcluir/{id}(id=${p.idProduto})}">
                            <button class="btn btn-group-lg btn-danger">Excluir</button>
                        </a>
                    </td>
                    <td align="center">
                        <a th:href="@{/ProdutoEditar/{id}(id=${p.idProduto})}">
                            <button class="btn btn-group-lg btn-warning">Editar</button>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</div>

<div th:each="p : ${produtos}">
    <div class="modal fade"
         th:id="'modalDetalhes' + ${p.idProduto}"
         tabindex="-1"
         aria-hidden="true">

        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header" style="background-color:#6610f2; color:white;">
                    <h5 class="modal-title">Detalhes do Produto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <div class="row">

                        <!-- IMAGEM -->
                        <div class="col-md-4 text-center">
                            <img th:src="${p.imagem}"
                                 class="img-fluid img-thumbnail mb-3"
                                 style="max-height: 250px;"
                                 alt="Imagem do Produto">
                        </div>

                        <!-- DADOS -->
                        <div class="col-md-8">

                            <p><b>ID:</b> <span th:text="${p.idProduto}"></span></p>
                            <p><b>Nome:</b> <span th:text="${p.nomeProduto}"></span></p>
                            <p><b>Preço:</b> R$ <span th:text="${p.preco}"></span></p>
                            <p><b>Quantidade em Estoque:</b> <span th:text="${p.qtdEstoque}"></span></p>
                            <p><b>Categoria:</b> <span th:text="${p.categoria.nomeCategoria}"></span></p>
                            <p><b>Fornecedor:</b> <span th:text="${p.fornecedor.nomeFornecedor}"></span></p>
                            <p><b>Data Fabricação:</b> <span th:text="${p.dataFabriFormatada}"></span></p>
                            <p><b>Data Validade:</b> <span th:text="${p.dataValiFormatada}"></span></p>
                            <p><b>Em promoção?</b>
                                <span th:text="${p.temPromocao ? 'SIM' : 'NÃO'}"></span>
                            </p>

                        </div>
                    </div>

                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>

            </div>
        </div>

    </div>
</div>

<footer th:replace="~{footer :: footer-content}" class="mt-auto"></footer>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    $(document).ready(function() {
        console.log('entrei ready');
        $('#datatable').DataTable({
            "scrollY": "300px",
            "scrollX": true,
            "scrollCollapse": true,
            "autoWidth": false,
            "oLanguage": {
                "sProcessing": "Processando...",
                "sLengthMenu": "Mostar _MENU_ registros",
                "sZeroRecords": "Nenhum registro encontrado.",
                "sInfo": "Mostrando de _START_ até _END_ de _TOTAL_ registros",
                "sInfoEmpty": "Mostrando de 0 até 0 de 0 registros",
                "sInfoFiltered": "",
                "sInfoPostFix": "",
                "sSearch": "Buscar:",
                "sUrl": "",
                "oPaginate": {
                    "sFirst": "Primeiro",
                    "sPrevious": "Anterior",
                    "sNext": "Seguinte",
                    "sLast": "Último"
                }
            }
        });
    });
</script>

</body>
</html>
