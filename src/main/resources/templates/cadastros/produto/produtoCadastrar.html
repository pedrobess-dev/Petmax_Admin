<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{header :: header-links}"></div>
    <style>
        .text-danger {
        color: #ff0000 !important; /* vermelho forte */
        font-weight: bold;
        font-size: 1rem;
        display: block;
        margin-top: 5px;
        text-shadow: 0 0 2px rgba(0,0,0,0.2);
    }
    </style>
</head>
<body>
<div th:replace="~{menu :: menu-bar}"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="page-title-box">
                <h2 class="page-title float-left" th:text="${modoEdicao} ? 'Edição de Produto' : 'Cadastro de Produto'"></h2>
                <ol class="breadcrumb float-right" style="background-color: #e6d9fc;">
                    <li class="breadcrumb-item"><a th:href="@{/home}" style="color: #6610f2;">Home</a></li>
                    <li class="breadcrumb-item active"><a th:href="@{/ProdutoListar}" style="color: #6610f2;">Produtos</a></li>
                </ol>
            </div>
        </div>
    </div>
    <!-- Basic Card Example -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h4 class="m-0 font-weight-bold" style="color: #6610f2;" th:text="${modoEdicao} ? 'Editar Produto' : 'Novo Produto'"></h4>
        </div>
        <div class="card-body">
            <form name="cadastrarproduto" th:action="@{/ProdutoSalvar}" th:object="${produto}" method="POST">
                <div class="form-row">
                    <input type="hidden" class="form-control form-control-user"
                           id="idproduto" name="idproduto" aria-describedby="ID do produto"
                           th:field="*{idProduto}" readonly="readonly" placeholder="">
                    <div class="form-group col-md-4">
                        <label for="nomeproduto" class="col-form-label">Nome do Produto</label>
                        <input type="text" class="form-control form-control-user"
                               id="nomeproduto" name="nomeproduto" aria-describedby="Nome do produto"
                               th:field="*{nomeProduto}" placeholder="Informe o nome do produto">
                        <span th:if="${#fields.hasErrors('nomeProduto')}" th:errors="*{nomeProduto}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-2">
                        <label for="preco" class="col-form-label">Preço</label>
                        <input type="number" step="any" class="form-control form-control-user"
                               id="preco" name="preco" aria-describedby="Preço do produto"
                               th:field="*{preco}" placeholder="Informe o preço do produto">
                        <span th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="idcategoria" class="col-form-label">Categoria</label>
                        <select th:field="*{categoria}" name="idcategoria" id="idcategoria" class="form-control form-control-user">
                            <option value="">Selecione</option>
                            <option th:each="cat : ${categorias}"
                                    th:value="${cat.idCategoria}"
                                    th:text="${cat.nomeCategoria}"
                                    th:selected="${produto.categoria != null and produto.categoria.idCategoria == cat.idCategoria}">
                            </option>
                        </select>
                        <span th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="idfornecedor" class="col-form-label">Fornecedor</label>
                        <select th:field="*{fornecedor}" name="idfornecedor" id="idfornecedor" class="form-control form-control-user">
                            <option value="">Selecione</option>
                            <option th:each="forne : ${fornecedores}"
                                    th:value="${forne.idFornecedor}"
                                    th:text="${forne.nomeFornecedor}"
                                    th:selected="${produto.fornecedor != null and produto.fornecedor.idFornecedor == forne.idFornecedor}">
                            </option>
                        </select>
                        <span th:if="${#fields.hasErrors('fornecedor')}" th:errors="*{fornecedor}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-2">
                        <label for="qtdEstoque" class="col-form-label">Quantidade</label>
                        <input type="number" step="1" class="form-control form-control-user"
                               id="qtdEstoque" name="qtdEstoque" aria-describedby="Quantidade no estoque"
                               th:field="*{qtdEstoque}" placeholder="Informe a quantidade no estoque">
                        <span th:if="${#fields.hasErrors('qtdEstoque')}" th:errors="*{qtdEstoque}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="dataFabricacao" class="col-form-label">Data de Fabricação</label>
                        <input type="date" class="form-control form-control-user"
                               id="dataFabricacao" name="dataFabricacao" aria-describedby="Data de fabricação"
                               th:field="*{dataFabricacao}" placeholder="Informe a data de fabricação">
                        <span th:if="${#fields.hasErrors('dataFabricacao')}" th:errors="*{dataFabricacao}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="dataValidade" class="col-form-label">Data de Validade</label>
                        <input type="date" class="form-control form-control-user"
                               id="dataValidade" name="dataValidade" aria-describedby="Data de validade"
                               th:field="*{dataValidade}" placeholder="Informe a data de validade">
                        <span th:if="${#fields.hasErrors('dataValidade')}" th:errors="*{dataValidade}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-2">
                        <label class="col-form-label">Em Promoção?</label>
                        <div class="form-check">
                            <input type="radio" class="form-check-input"
                                   id="promocaoSim" name="temPromocao" value="true"
                                   th:field="*{temPromocao}">
                            <label class="form-check-label" for="promocaoSim">SIM</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" class="form-check-input"
                                   id="promocaoNao" name="temPromocao" value="false"
                                   th:field="*{temPromocao}">
                            <label class="form-check-label" for="promocaoNao">NÃO</label>
                        </div>
                        <span th:if="${#fields.hasErrors('temPromocao')}" th:errors="*{temPromocao}" class="text-danger"></span>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <input class="btn btn-facebook btn-user btn-block" style="background-color: #6610f2;" type="submit" name="cadastrar" id="cadastrar" value="Cadastrar"/>
                    </div>
                    <div class="form-group col-md-6">
                        <input class="btn btn-facebook btn-user btn-block" style="background-color: #6610f2;" type="reset" name="limpar" id="limpar" value="Limpar">
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</div>

<footer th:replace="~{footer :: footer-content}" class="mt-auto"></footer>
</div>
</div>

<script src="https://unpkg.com/inputmask@5.0.8/dist/inputmask.min.js"></script>
<script>
    window.addEventListener("DOMContentLoaded", function () {
        const preco = document.getElementById("preco");

        if (preco) {
            Inputmask({
                alias: "currency",
                prefix: "R$ ",
                groupSeparator: ".",
                radixPoint: ",",
                digits: 2,
                digitsOptional: false,
                rightAlign: false,
                autoUnmask: true
            }).mask(preco);
        }
    });
</script>

</body>
</html>
