<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{header :: header-links}"></div>
    <style>
        .text-danger {
        color: #ff0000 !important; /* vermelho forte */
        font-weight: bold;
        font-size: 1rem;
        display: block;
        margin-top: 5px;
        text-shadow: 0 0 2px rgba(0,0,0,0.2);
    }
    </style>
</head>
<body>
<div th:replace="~{menu :: menu-bar}"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="page-title-box">
                <h2 class="page-title float-left" th:text="${modoEdicao} ? 'Edição de Categoria' : 'Cadastro de Categoria'"></h2>
                <ol class="breadcrumb float-right" style="background-color: #e6d9fc;">
                    <li class="breadcrumb-item"><a th:href="@{/home}" style="color: #6610f2;">Home</a></li>
                    <li class="breadcrumb-item active"><a th:href="@{/CategoriaListar}" style="color: #6610f2;">Categorias</a></li>
                </ol>
            </div>
        </div>
    </div>
    <!-- Basic Card Example -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h4 class="m-0 font-weight-bold" style="color: #6610f2;" th:text="${modoEdicao} ? 'Editar Categoria' : 'Nova Categoria'"></h4>
        </div>
        <div class="card-body">
            <form name="cadastrarcategoria" th:action="@{/CategoriaSalvar}" th:object="${categoria}" method="POST">
                <div class="form-row">
                    <input type="hidden" class="form-control form-control-user"
                           id="idcategoria" name="idcategoria" aria-describedby="ID da categoria"
                           th:field="*{idCategoria}" readonly="readonly" placeholder="">
                    <div class="form-group col-md-4">
                        <label for="nomecategoria" class="col-form-label">Nome da Categoria</label>
                        <input type="text" class="form-control form-control-user"
                               id="nomecategoria" name="nomecategoria" aria-describedby="Nome da categoria"
                               th:field="*{nomeCategoria}" placeholder="Informe o nome da categoria">
                        <span th:if="${#fields.hasErrors('nomeCategoria')}" th:errors="*{nomeCategoria}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="descricao" class="col-form-label">Descrição</label>
                        <input type="text" class="form-control form-control-user"
                               id="descricao" name="descricao" aria-describedby="Descrição da categoria"
                               th:field="*{descricao}" placeholder="Informe a descrição da categoria">
                        <span th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}" class="text-danger"></span>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <input class="btn btn-facebook btn-user btn-block" style="background-color: #6610f2;" type="submit" name="cadastrar" id="cadastrar" value="Cadastrar"/>
                    </div>
                    <div class="form-group col-md-6">
                        <input class="btn btn-facebook btn-user btn-block" style="background-color: #6610f2;" type="reset" name="limpar" id="limpar" value="Limpar">
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</div>

<footer th:replace="~{footer :: footer-content}" class="mt-auto"></footer>
</div>
</div>

</body>
</html>
