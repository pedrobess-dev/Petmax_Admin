<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{header :: header-links}"></div>
    <style>
        .text-danger {
        color: #ff0000 !important; /* vermelho forte */
        font-weight: bold;
        font-size: 1rem;
        display: block;
        margin-top: 5px;
        text-shadow: 0 0 2px rgba(0,0,0,0.2);
    }
    .alert-danger {
            background-color: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 8px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            position: relative;
            padding-right: 2.5rem;
    }
    .btn-close {
        position: absolute;
        top: 50%;
        right: 0.8rem;
        transform: translateY(-50%);
        background: none;
        border: none;
        font-size: 1.2rem;
        color: #fff;
        cursor: pointer;
        padding: 0;
        line-height: 1;
    }
    .btn-close::after {
        content: "X"; /* X clássico */
    }
    .btn-close:focus {
        outline: none;
        box-shadow: none;
    }
    </style>
</head>
<body>
<div th:replace="~{menu :: menu-bar}"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="page-title-box">
                <h2 class="page-title float-left" th:text="${modoEdicao} ? 'Edição de Fornecedor' : 'Cadastro de Fornecedor'"></h2>
                <ol class="breadcrumb float-right" style="background-color: #e6d9fc;">
                    <li class="breadcrumb-item"><a th:href="@{/home}" style="color: #6610f2;">Home</a></li>
                    <li class="breadcrumb-item active"><a th:href="@{/FornecedorListar}" style="color: #6610f2;">Fornecedores</a></li>
                </ol>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div th:if="${erroCnpj}" class="alert alert-danger alert-dismissible fade show" role="alert" id="errorAlert">
                <span th:text="${erroCnpj}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>
    </div>
    <!-- Basic Card Example -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h4 class="m-0 font-weight-bold" style="color: #6610f2;" th:text="${modoEdicao} ? 'Editar Fornecedor' : 'Novo Fornecedor'"></h4>
        </div>
        <div class="card-body">
            <form name="cadastrarfornecedor" th:action="@{/FornecedorSalvar}" th:object="${fornecedor}" method="POST">
                <div class="form-row">
                    <input type="hidden" class="form-control form-control-user"
                           id="idfornecedor" name="idfornecedor" aria-describedby="ID do fornecedor"
                           th:field="*{idFornecedor}" readonly="readonly" placeholder="">
                    <div class="form-group col-md-4">
                        <label for="nomefornecedor" class="col-form-label">Nome do Fornecedor</label>
                        <input type="text" class="form-control form-control-user"
                               id="nomefornecedor" name="nomefornecedor" aria-describedby="Nome do fornecedor"
                               th:field="*{nomeFornecedor}" placeholder="Informe o nome do fornecedor">
                        <span th:if="${#fields.hasErrors('nomeFornecedor')}" th:errors="*{nomeFornecedor}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="telefone" class="col-form-label">Telefone</label>
                        <input type="text" class="form-control form-control-user"
                               id="telefone" name="telefone" aria-describedby="Telefone do fornecedor"
                               th:field="*{telefone}" placeholder="Informe o telefone do fornecedor">
                        <span th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="cnpj" class="col-form-label">CNPJ</label>
                        <input type="text" class="form-control form-control-user"
                               id="cnpj" name="cnpj" aria-describedby="CNPJ do fornecedor"
                               th:field="*{cnpj}" placeholder="Informe a CNPJ do fornecedor">
                        <span th:if="${#fields.hasErrors('cnpj')}" th:errors="*{cnpj}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="email" class="col-form-label">Email</label>
                        <input type="text" class="form-control form-control-user"
                               id="email" name="email" aria-describedby="Email do fornecedor"
                               th:field="*{email}" placeholder="Informe o email do fornecedor">
                        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="cep" class="col-form-label">CEP</label>
                        <input type="text" class="form-control form-control-user"
                               id="cep" name="cep" aria-describedby="CEP do fornecedor"
                               th:field="*{cep}" placeholder="Informe o CEP do fornecedor">
                        <span th:if="${#fields.hasErrors('cep')}" th:errors="*{cep}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-2">
                        <label for="uf" class="col-form-label">UF</label>
                        <input type="text" class="form-control form-control-user"
                               id="uf" name="uf" aria-describedby="UF do fornecedor"
                               th:field="*{uf}" placeholder="Informe o UF do fornecedor">
                        <span th:if="${#fields.hasErrors('uf')}" th:errors="*{uf}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="cidade" class="col-form-label">Cidade</label>
                        <input type="text" class="form-control form-control-user"
                               id="cidade" name="cidade" aria-describedby="Cidade do fornecedor"
                               th:field="*{cidade}" placeholder="Informe a cidade do fornecedor">
                        <span th:if="${#fields.hasErrors('cidade')}" th:errors="*{cidade}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="bairro" class="col-form-label">Bairro</label>
                        <input type="text" class="form-control form-control-user"
                               id="bairro" name="bairro" aria-describedby="Bairro do fornecedor"
                               th:field="*{bairro}" placeholder="Informe o bairro do fornecedor">
                        <span th:if="${#fields.hasErrors('bairro')}" th:errors="*{bairro}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="rua" class="col-form-label">Rua</label>
                        <input type="text" class="form-control form-control-user"
                               id="rua" name="rua" aria-describedby="Rua do fornecedor"
                               th:field="*{rua}" placeholder="Informe a rua do fornecedor">
                        <span th:if="${#fields.hasErrors('rua')}" th:errors="*{rua}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-2">
                        <label for="numero" class="col-form-label">N°</label>
                        <input type="number" step="1" class="form-control form-control-user"
                               id="numero" name="numero" aria-describedby="N° do fornecedor"
                               th:field="*{numero}" placeholder="Informe o N° do fornecedor">
                        <span th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}" class="text-danger"></span>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <input class="btn btn-facebook btn-user btn-block" style="background-color: #6610f2;" type="submit" name="cadastrar" id="cadastrar" value="Cadastrar"/>
                    </div>
                    <div class="form-group col-md-6">
                        <input class="btn btn-facebook btn-user btn-block" style="background-color: #6610f2;" type="reset" name="limpar" id="limpar" value="Limpar">
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</div>

<footer th:replace="~{footer :: footer-content}" class="mt-auto"></footer>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/inputmask@5.0.8/dist/inputmask.min.js"></script>
<script>
    window.addEventListener("DOMContentLoaded", function () {
        const cnpj = document.getElementById("cnpj");
        const telefone = document.getElementById("telefone");
        const cep = document.getElementById("cep");

        if (cnpj) {
            Inputmask("99.999.999/9999-99").mask(cnpj);
        }

        if (telefone) {
            Inputmask("(99)99999-9999").mask(telefone);
        }

        if (cep) {
            Inputmask("99999-999").mask(cep);
        }
    });

    const cepInput = document.getElementById("cep");

    cepInput.addEventListener("input", function() {
        let cep = this.value.replace(/\D/g, ''); // remove não dígitos
        if (cep.length === 8) { // dispara só quando tiver 8 dígitos
            fetch(`https://viacep.com.br/ws/${cep}/json/`)
                .then(res => res.json())
                .then(data => {
                    if (!data.erro) {
                        document.getElementById("rua").value = data.logradouro;
                        document.getElementById("bairro").value = data.bairro;
                        document.getElementById("cidade").value = data.localidade;
                        document.getElementById("uf").value = data.uf;
                    } else {
                        alert("CEP não encontrado!");
                    }
                })
                .catch(err => console.error(err));
        }
    });

</script>

</body>
</html>
