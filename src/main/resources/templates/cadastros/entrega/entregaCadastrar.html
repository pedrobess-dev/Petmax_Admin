<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{header :: header-links}"></div>
    <style>
        .text-danger {
        color: #ff0000 !important; /* vermelho forte */
        font-weight: bold;
        font-size: 1rem;
        display: block;
        margin-top: 5px;
        text-shadow: 0 0 2px rgba(0,0,0,0.2);
    }
    </style>
</head>
<body>
<div th:replace="~{menu :: menu-bar}"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="page-title-box">
                <h2 class="page-title float-left" th:text="${modoEdicao} ? 'Edição de Entrega' : 'Cadastro de Entrega'"></h2>
                <ol class="breadcrumb float-right" style="background-color: #e6d9fc;">
                    <li class="breadcrumb-item"><a th:href="@{/home}" style="color: #6610f2;">Home</a></li>
                    <li class="breadcrumb-item active"><a th:href="@{/EntregaListar}" style="color: #6610f2;">Entregas</a></li>
                </ol>
            </div>
        </div>
    </div>
    <!-- Basic Card Example -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h4 class="m-0 font-weight-bold" style="color: #6610f2;" th:text="${modoEdicao} ? 'Editar Entrega' : 'Nova Entrega'"></h4>
        </div>
        <div class="card-body">
            <form name="cadastrarentrega" th:action="@{/EntregaSalvar}" th:object="${entrega}" method="POST">
                <div class="form-row">
                    <input type="hidden" class="form-control form-control-user"
                           id="identrega" name="identrega" aria-describedby="ID da entrega"
                           th:field="*{idEntrega}" readonly="readonly" placeholder="">
                    <div class="form-group col-md-4">
                        <label for="idvenda" class="col-form-label">Venda</label>
                        <select th:field="*{venda}" name="idvenda" id="idvenda" class="form-control form-control-user">
                            <option value="">Selecione</option>
                            <option th:each="v : ${vendas}"
                                    th:value="${v.idVenda}"
                                    th:text="${v.idVenda}"
                                    th:selected="${entrega.venda != null and entrega.venda.idVenda == v.idVenda}">
                            </option>
                        </select>
                        <span th:if="${#fields.hasErrors('venda')}" th:errors="*{venda}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-2">
                        <label for="cep" class="col-form-label">CEP</label>
                        <input type="text" class="form-control form-control-user"
                               id="cep" name="cep" aria-describedby="CEP da entrega"
                               th:field="*{cep}" placeholder="Informe o CEP da entrega">
                        <span th:if="${#fields.hasErrors('cep')}" th:errors="*{cep}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="bairro" class="col-form-label">Bairro</label>
                        <input type="text" class="form-control form-control-user"
                               id="bairro" name="bairro" aria-describedby="Bairro da entrega"
                               th:field="*{bairro}" placeholder="Informe o bairro da entrega">
                        <span th:if="${#fields.hasErrors('bairro')}" th:errors="*{bairro}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-4">
                        <label for="rua" class="col-form-label">Rua</label>
                        <input type="text" class="form-control form-control-user"
                               id="rua" name="rua" aria-describedby="Rua da entrega"
                               th:field="*{rua}" placeholder="Informe a rua da entrega">
                        <span th:if="${#fields.hasErrors('rua')}" th:errors="*{rua}" class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-2">
                        <label for="numero" class="col-form-label">N°</label>
                        <input type="number" step="1" class="form-control form-control-user"
                               id="numero" name="numero" aria-describedby="N° da entrega"
                               th:field="*{numero}" placeholder="Informe o N° da entrega">
                        <span th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}" class="text-danger"></span>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <input class="btn btn-facebook btn-user btn-block" style="background-color: #6610f2;" type="submit" name="cadastrar" id="cadastrar" value="Cadastrar"/>
                    </div>
                    <div class="form-group col-md-6">
                        <input class="btn btn-facebook btn-user btn-block" style="background-color: #6610f2;" type="reset" name="limpar" id="limpar" value="Limpar">
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</div>

<footer th:replace="~{footer :: footer-content}" class="mt-auto"></footer>
</div>
</div>

<script src="https://unpkg.com/inputmask@5.0.8/dist/inputmask.min.js"></script>
<script>
    window.addEventListener("DOMContentLoaded", function () {
        const cep = document.getElementById("cep");

        if (cep) {
            Inputmask("99999-999").mask(cep);
        }
    });
</script>

</body>
</html>
