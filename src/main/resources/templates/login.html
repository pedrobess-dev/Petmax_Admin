<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title>PetAdmin - Login</title>

  <!-- Fontes e CSS -->
  <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
  <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">
  <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100" style="background-color: #6610f2;">

<div class="container flex-grow-1">
  <div class="row justify-content-center">
    <div class="col-xl-6 col-lg-8 col-md-10 mt-5">
      <div class="card o-hidden border-0 shadow-lg my-5">
        <h1 class="h1 mb-0 text-gray-900 text-center" style="padding-top: 20px;">PetAdmin</h1>
        <div class="card-body p-0">
          <div class="row no-gutters">
            <div class="col-md-12">
              <div class="card-body p-5">
                <div class="text-center">
                  <h1 class="h4 text-gray-900 mb-4">Login</h1>
                </div>

                <!-- Formulário de login Spring Security -->
                <form th:action="@{/login}" method="post" class="user">
                  <div class="form-group">
                    <input type="text" name="username"
                           class="form-control form-control-user border-danger"
                           placeholder="Insira o nome do usuário..." required>
                  </div>
                  <div class="form-group">
                    <input type="password" name="password"
                           class="form-control form-control-user border-danger"
                           placeholder="Senha" required>
                  </div>
                  <button type="submit"
                          class="btn btn-user btn-block text-white"
                          style="background-color: #6610f2;">
                    Login
                  </button>
                </form>

                <div class="text-center mt-3">
                  <a class="small" th:href="@{/register}">Não possui uma conta? Registre-se!</a>
                </div>

                <!-- Mensagens de erro e logout -->
                <div th:if="${param.error}" class="text-danger mt-3">
                  Usuário ou senha inválidos.
                </div>
                <div th:if="${param.logout}" class="text-success mt-3">
                  Logout realizado com sucesso.
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- JS -->
<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>

<div th:replace="~{shortfooter :: short-footer}" class="mt-auto"></div>
</body>
</html>
